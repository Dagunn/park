<section class="section bg-surface-alt pb-section-end" aria-labelledby="partners-title" data-carousel>
  <div class="container-content">
    <h2 id="partners-title" class="section-title mb-heading">Партнеры</h2>

    <ul class="slider mb-8" data-carousel-track>
      <li class="card-partner slider-item slider-item-6">
        <img src="assets/images/logos/partner-kod.svg" width="102" height="40" alt="КОД Сокольники" loading="lazy">
      </li>
      <li class="card-partner slider-item slider-item-6">
        <img src="assets/images/logos/partner-ozon.svg" width="85" height="48" alt="Ozon fresh" loading="lazy">
      </li>
      <li class="card-partner slider-item slider-item-6">
        <img src="assets/images/logos/partner-mri.png" data-widths="122,244" sizes="122px" width="122" height="48" alt="Музей русского импрессионизма" loading="lazy" decoding="async" class="size-auto">
      </li>
      <li class="card-partner slider-item slider-item-6">
        <img src="assets/images/logos/partner-souz.png" data-widths="146,292" sizes="146px" width="146" height="42" alt="Союзмультфильм" loading="lazy" decoding="async" class="size-auto">
      </li>
      <li class="card-partner slider-item slider-item-6">
        <img src="assets/images/logos/partner-premier.png" data-widths="144,288" sizes="144px" width="144" height="18" alt="Premier" loading="lazy" decoding="async" class="size-auto">
      </li>
      <li class="card-partner slider-item slider-item-6">
        <img src="assets/images/logos/partner-vkusvill.svg" width="84" height="42" alt="ВкусВилл" loading="lazy">
      </li>
    </ul>

    <div class="flex items-center justify-between gap-4">
      <div class="flex gap-4">
        <button class="btn btn-icon btn-light" type="button" aria-label="Назад" data-carousel-prev>
          <span class="icon">@@include('src/assets/icons/arrow-long-left.svg')</span>
        </button>
        <button class="btn btn-icon btn-light" type="button" aria-label="Вперед" data-carousel-next>
          <span class="icon">@@include('src/assets/icons/arrow-long-right.svg')</span>
        </button>
      </div>
      <a class="btn btn-ghost btn-arrow max-sm:px-0" href="#">
        Все партнеры
        <span class="icon">@@include('src/assets/icons/arrow-long-right.svg')</span>
      </a>
    </div>
  </div>
</section>
